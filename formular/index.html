<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>formular</title>
</head>
<body>
    <h1>Technická podpora</h1>

    <form action="#" method="post">
        
        <div class="form-group">
            <label for="name">Jméno a příjmení *</label>
            <input type="text" id="name" name="name" required placeholder="Jan Novák">
        </div>

        <div class="form-group">
            <label for="email">E-mailová adresa *</label>
            <input type="email" id="email" name="email" required placeholder="jan@example.cz">
        </div>

        <div class="form-group">
            <label for="subject">Předmět *</label>
            <input type="text" id="subject" name="subject" required placeholder="Stručný popis chybového stavu">
        </div>

        <div class="form-group">
            <label for="message">Popis problému *</label>
            <textarea id="message" name="message" required placeholder="Popište detailně Váš problém..."></textarea>
        </div>

        <button type="submit">Odeslat požadavek</button>

    </form>

</body>
</html>
